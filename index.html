<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audrey Schickler</title>
    <meta name="description" content="Audrey Schickler — links to my profiles around the web." />
    <link rel="icon" href="./src/favicon.svg" />
    <link rel="stylesheet" href="./src/styles.css" />
    <script>
      // Runs before paint so a stored choice never flashes the other theme.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <!-- The pen font is a static TrueType, so its glyphs can't boil the way the
         SVG sketches do; displacing them with a different turbulence seed each
         frame is what makes the words move. Two sets because displacement has
         to scale with type size -- 2.2px reads as a wobble on the 68px name and
         as mush on a 26px heading. sRGB stops the filter shifting colour. -->
    <svg class="boil-defs" aria-hidden="true" focusable="false">
      <filter id="pen-boil-lg-0" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="1" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="pen-boil-lg-1" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="2" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="pen-boil-lg-2" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="3" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="pen-boil-sm-0" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="1" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="pen-boil-sm-1" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="2" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="pen-boil-sm-2" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="3" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <div class="paper">
      <main class="sheet">
        <div class="theme-row">
          <label class="theme-toggle">
            <span class="theme-icon-slot" data-icon="sun"></span>
            <span class="theme-toggle-track">
              <!-- The icons are decorative, so the name lives on the input. -->
              <input type="checkbox" aria-label="Dark mode" />
            </span>
            <span class="theme-icon-slot" data-icon="moon"></span>
          </label>
        </div>

        <header class="masthead">
          <div class="masthead-text">
            <h1 class="name">Audrey Schickler</h1>
          </div>
          <!-- CSS rounds this to a clean oval on its own; src/portrait.ts
               upgrades it to a rough-clipped photo inside a boiling pen ring. -->
          <figure class="portrait">
            <img
              class="portrait-src"
              src="./src/portrait.jpg"
              alt="Audrey"
              width="528"
              height="660"
            />
          </figure>
        </header>

        <hr id="rule-1" />

        <!-- Positions live in CSS so the scatter survives without JS;
             charms.ts draws the doodles and adds the per-load tilt. The label
             is only visually hidden, so it is still the link's name. -->
        <nav class="charms" id="charms" aria-label="Profiles elsewhere">
          <a class="charm" data-charm="arena" href="https://www.are.na/audrey-schickler/channels" rel="me noopener">
            <span class="charm-art"></span>
            <span class="charm-label">Are.na</span>
          </a>
          <a class="charm" data-charm="x" href="https://x.com/rndmgl" rel="me noopener">
            <span class="charm-art"></span>
            <span class="charm-label">X</span>
          </a>
          <a class="charm" data-charm="github" href="https://github.com/tooolip" rel="me noopener">
            <span class="charm-art"></span>
            <span class="charm-label">GitHub</span>
          </a>
          <a class="charm" data-charm="storygraph" href="https://app.thestorygraph.com/profile/prettyauds" rel="me noopener">
            <span class="charm-art"></span>
            <span class="charm-label">StoryGraph</span>
          </a>
          <a class="charm" data-charm="letterboxd" href="https://letterboxd.com/prettyauds/" rel="me noopener">
            <span class="charm-art"></span>
            <span class="charm-label">Letterboxd</span>
          </a>
          <a class="charm" data-charm="backloggd" href="https://backloggd.com/u/prettyaud/" rel="me noopener">
            <span class="charm-art"></span>
            <span class="charm-label">Backloggd</span>
          </a>
        </nav>
      </main>
    </div>
  </body>
</html>
